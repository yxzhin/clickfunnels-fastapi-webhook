x-app: &app
  build:
    context: .
    dockerfile: ./src/backend/Dockerfile.prod
  restart: unless-stopped
  env_file:
    - .env
  networks:
    - internal
    - proxy

services:
  cfw-backend:
    <<: *app
    container_name: cfw_prod_backend
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      cfw-redis:
        condition: service_healthy
      cfw-postgres:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request
          urllib.request.urlopen("http://127.0.0.1:8000/health")
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cfw-taskiq-worker:
    <<: *app
    container_name: cfw_prod_worker
    command:
      - taskiq
      - worker
      - src.backend.app.utils.di.di_container:broker
      - src.backend.app.utils.taskiq.tasks
      - --workers
      - "4"
      - --log-level
      - INFO
    depends_on:
      cfw-backend:
        condition: service_healthy

  cfw-taskiq-scheduler:
    <<: *app
    container_name: cfw_prod_scheduler
    command:
      - taskiq
      - scheduler
      - src.backend.app.utils.di.di_container:scheduler
      - --skip-first-run
      - --log-level
      - INFO
    depends_on:
      cfw-backend:
        condition: service_healthy

  cfw-redis:
    image: redis:latest
    container_name: cfw_prod_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --save 60 1000
      --maxmemory 1024mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal

  cfw-postgres:
    image: postgres:latest
    container_name: cfw_prod_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASS}
      - POSTGRES_DB=${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal


networks:
  internal:
  proxy:
    external: true

volumes:
  redis_data:
  postgres_data:
