x-app: &app
  build:
    context: .
    dockerfile: ./src/backend/Dockerfile.prod
  restart: unless-stopped
  env_file:
    - .env
  networks:
    - internal

services:
  backend:
    <<: *app
    container_name: cfw_prod_backend
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request
          urllib.request.urlopen("http://127.0.0.1:8000/health")
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  worker:
    <<: *app
    container_name: cfw_prod_worker
    command:
      - taskiq
      - worker
      - app.utils.tasks:broker
      - app.utils.tasks
      - --log-level
      - INFO
    depends_on:
      backend:
        condition: service_healthy

  scheduler:
    <<: *app
    container_name: cfw_prod_scheduler
    command:
      - taskiq
      - scheduler
      - app.utils.tasks:scheduler
      - --skip-first-run
      - --log-level
      - INFO
    depends_on:
      backend:
        condition: service_healthy

  redis:
    image: redis:latest
    container_name: cfw_prod_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: >
      redis-server
      --appendonly yes
      --save 60 1000
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - internal

  caddy:
    image: caddy:latest
    container_name: cfw_prod_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${CADDY_DOMAIN}
      EMAIL: ${CADDY_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - internal

networks:
  internal:

volumes:
  redis_data:
  caddy_data:
  caddy_config:
