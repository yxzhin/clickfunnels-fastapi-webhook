name: CI

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - "**"

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      frontend: ${{ steps.changes.outputs.frontend }}
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            backend:
              - 'src/backend/**'

  backend:
    needs: changes
    if: ${{ needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6.0.2
      - uses: astral-sh/setup-uv@v7.3.0
      - run: uv python install
      - name: cache uv
        uses: actions/cache@v5.0.4
        with:
          path: |
            ~/.cache/uv
            ~/.local/share/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - name: cache pytest
        uses: actions/cache@v5.0.4
        with:
          path: .pytest_cache
          key: pytest-${{ runner.os }}-${{ hashFiles('src/backend/**/*.py') }}
          restore-keys: |
            uv-${{ runner.os }}-
      - run: uv sync --frozen
      - run: uv run pytest
        env:
          APP_NAME: clickfunnels-fastapi-webhook
          APP_DESCRIPTION: clickfunnels-fastapi-webhook
          APP_VERSION: 0.1.0
          CADDY_DOMAIN: localhost
          CADDY_EMAIL: user@example.com
          CLICKFUNNELS_SUBDOMAIN: myworkspace
          CLICKFUNNELS_WORKSPACE_ID: example
          CLICKFUNNELS_API_TOKEN: example
          CLICKFUNNELS_WEBHOOK_SECRET: example
          TWILIO_ACCOUNT_SID: example
          TWILIO_AUTH_TOKEN: example
          TWILIO_FROM_NUMBER: example
          TWILIO_TEST_ACCOUNT_SID: ${{ secrets.TWILIO_TEST_ACCOUNT_SID }}
          TWILIO_TEST_AUTH_TOKEN: ${{ secrets.TWILIO_TEST_AUTH_TOKEN }}
          REDIS_URL: redis://redis:6379/0
          REGISTRATION_TODAY_LA_PAGE_NAME: reg-today-la
          REGISTRATION_TODAY_AU_PAGE_NAME: reg-today-au
          REGISTRATION_TOMORROW_LA_PAGE_NAME: reg-tomorrow-la
          REGISTRATION_TOMORROW_AU_PAGE_NAME: reg-tomorrow-au
