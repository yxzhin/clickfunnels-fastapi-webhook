[project]
name = "clickfunnels-fastapi-webhook"
version = "0.1.0"
description = "a simple service to use w/ CF workflows that updates custom attributes of a CF contact. made by yxzhin with <3"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dishka>=1.10.1",
    "fastapi[standard-no-fastapi-cloud-cli]>=0.133.1",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "phonenumbers>=9.0.34",
    "pydantic>=2.13.1",
    "pydantic-settings>=2.13.1",
    "redis>=7.2.1",
    "taskiq>=0.12.4",
    "taskiq-redis>=1.2.2",
    "twilio>=9.10.9",
    "tzdata>=2026.3",
]
[dependency-groups]
dev = [
    "mypy>=1.19.1",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.0.0",
    "ruff>=0.15.2",
]
prod = [
    "gunicorn>=25.1.0",
]

[tool.uv]
package = false

[tool.uv.sources]
backend = { path = "src/backend" }

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py313"
exclude = [
    "src/frontend",
    "*/alembic/*"
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.ruff.lint]
fixable = ["ALL"]
unfixable = []
select = [
    "E",  # pycodestyle (errors)
    "F",  # pyflakes
    "I",  # isort
    "N",  # pep8-naming
    "UP", # pyupgrade (современный синтаксис)
    "B",  # flake8-bugbear (дополнительные проверки)
    "C4", # flake8-comprehensions
    "A",  # flake8-builtins (не переопределять встроенные имена)
]
ignore = [
    "E501",
    "ANN401",
    "F403", "F405",
    "B008"
]

[tool.mypy]
python_version = "3.13"
strict = false
warn_unused_configs = true
warn_return_any = false
warn_unused_ignores = false
disallow_untyped_defs = false
disallow_untyped_decorators = false
ignore_missing_imports = true
disallow_subclassing_any = false
explicit_package_bases = true
check_untyped_defs = true
exclude = [
  "^src/frontend/",
  "^src/backend/alembic/"
]

[tool.pytest.ini_options]
addopts = "-v --cov=src/backend --cov-report=html --cov-report=xml"
testpaths = [
    "src/backend/tests",
]
pythonpath = ["."]
asyncio_mode = "auto"
